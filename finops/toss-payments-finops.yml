description: >-
  FinOps view of Toss Payments spend. Unlike a typical SaaS API, Toss Payments
  charges no fee for API access - cost is incurred as a per-transaction payment
  processing fee (PG fee) on the value of each approved payment. The dominant
  cost driver is the effective fee rate per payment method (card, easy-pay
  wallet, virtual account, bank transfer, mobile phone), which is set by the
  merchant contract and varies by industry/sales category and merchant grade.
  Card processing is publicly cited around 4.3% including 10% VAT for direct
  sign-up; other methods differ and virtual account is typically a fixed fee per
  deposit. Settlement (payout to the merchant) and, for marketplaces, seller
  payouts add timing and balance considerations rather than new fees. Because
  effective rates are contract-specific and not fully public, per-unit amounts
  are not reconciled here.
notes: >-
  Model the effective blended fee rate from your own settlement data (the
  Settlements API returns per-transaction fee and payOutAmount), since headline
  rates vary by contract and method. VAT (10%) applies on top of Korean card
  fees. Verify current method-by-method rates on the Toss Payments fee page.
