  properties:
  - url: https://docs.tosspayments.com/reference/brandpay
    type: Documentation
  description: >-
    Brandpay is Toss Payments' embeddable in-merchant easy-pay wallet, letting customers register payment
    methods once and reuse them. Method and customer status changes are pushed via the METHOD_UPDATED
    and CUSTOMER_STATUS_CHANGED webhooks. (Documented product; individual Brandpay endpoints are not modeled
    in the OpenAPI in this entry.)
