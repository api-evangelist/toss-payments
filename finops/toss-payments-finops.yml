meters:
- name: card_transaction_fee
  description: Percentage fee on approved card payment value (publicly cited around 4.3% incl. VAT for direct sign-up; contract-dependent).
  unit: transaction_value
  aggregation: sum
  dimensions:
  - account
  - method
  - card_company
- name: easy_pay_transaction_fee
  description: Percentage fee on approved easy-pay/wallet payment value (Toss Pay, KakaoPay, Naver Pay; contract-dependent).
  unit: transaction_value
  aggregation: sum
  dimensions:
  - account
  - provider
- name: virtual_account_fee
  description: Fee per virtual account deposit (typically fixed per transaction; contract-dependent).
  unit: transaction
  aggregation: sum
  dimensions:
  - account
  - bank
- name: transfer_fee
  description: Fee on approved bank transfer payments (percentage or fixed; contract-dependent).
  unit: transaction_value
  aggregation: sum
  dimensions:
  - account
- name: vat
  description: 10% Korean VAT applied on top of card processing fees.
  unit: currency
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Pull per-transaction fee and payOutAmount from the Settlements API to compute an effective blended fee rate by method rather than relying on headline rates.
- name: Allocation
  description: Tag payments with orderId / customerKey per product or team so processing fees map to internal cost centers and revenue lines.
- name: Optimization
  description: Steer customers toward lower-fee methods where appropriate, negotiate method-by-method rates by volume and merchant grade, and reconcile refunds/cancellations which reverse fees.
- name: Accountability
  description: Review monthly settlement reports against expected fee rates; assign an owner for the merchant contract and its per-method rate schedule.
